packages:
  - 'packages/*'
  - '!packages/_shared'
  # Live dev harness. Private, never published — consumes the packages from source
  # via workspace:* so an edit in packages/*/src hot-reloads without a build.
  - 'playground'

allowBuilds:
  # Its postinstall checks the platform binary Vite runs.
  esbuild: true

minimumReleaseAgeExclude:
  - '@cujuju/solid-reorder-list@0.3.0'
