# Builds, type-checks and tests the packages on every push to main and every pull request. `check` is a required status check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each package's `types` export points at dist/, so build before type-checking.
      - run: pnpm build
      - run: pnpm typecheck
      # Packages only, one at a time: parallel vitest runs share a transform cache. The playground's suite is excluded, as in `build`.
      - run: pnpm --filter './packages/*' --workspace-concurrency=1 test

  macos-updates:
    # electron-updates on a Mac: runs the real bundle swap and a packaged stage → quit → swap → relaunch smoke.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The smoke's fixture app loads the built package.
      - run: pnpm --filter @cujuju/electron-updates build
      # Outside the workspace, so the lockfile stays Electron-free; the package downloads its binary on first require.
      - name: Download Electron
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/electron" electron@45.0.0
          # Electron 45 downloads its binary on first require and may print progress there; only the last line is the path.
          node -e "require('$RUNNER_TEMP/electron/node_modules/electron')" > /dev/null
          app="$(node -p "require('$RUNNER_TEMP/electron/node_modules/electron')" | tail -n 1 | sed 's#/Contents/MacOS/Electron$##')"
          test -d "$app"
          echo "ELECTRON_UPDATES_ELECTRON_APP=$app" >> "$GITHUB_ENV"
      - run: pnpm --filter @cujuju/electron-updates exec vitest run src/__tests__/macSwap.test.ts
